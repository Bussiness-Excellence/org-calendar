# Builds an installable Android APK and attaches it to a GitHub Release.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'supabase/**'
      - '.github/workflows/web.yml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: android
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk OrgCalendar-test.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          make_latest: true
          files: OrgCalendar-test.apk
          body: |
            Test build of Org Calendar for Android, connected to the TEST database.
            Download OrgCalendar-test.apk on your phone, open it and allow installing from this source.
