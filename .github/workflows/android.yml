# Builds an installable Android APK and attaches it to a GitHub Release.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'supabase/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the Android project
        run: |
          set -o pipefail
          if ! npx expo prebuild --platform android --no-install 2>&1 | tee prebuild.log; then
            echo "::error title=Prebuild failed::$(tail -40 prebuild.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: Check Expo autolinking
        working-directory: android
        run: |
          set -o pipefail
          E="$GITHUB_WORKSPACE/node_modules/expo/android"
          if ! node --no-warnings --eval "require('expo/bin/autolinking')" expo-modules-autolinking mirror-kotlin-inline-modules --kotlin-files-mirror-directory "$E/src/main/java/inline/modules/" --inline-modules-list-directory "$E/build/inline/modules/" --watched-directories-serialized "[]" > autolink.log 2>&1; then
            cp autolink.log build.log; exit 1
          fi
      - name: Build the APK
        working-directory: android
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          # Expo 57 passes an empty list (no value) when this is unset, which breaks autolinking.
          echo 'expo.inlineModules.watchedDirectories=[]' >> gradle.properties
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee build.log; then
            # Surface the cause as a public annotation (logs need sign-in).
            msg=$( (grep -n -A12 "What went wrong" build.log; grep -n -E "error:|ERROR:|Exception" build.log | head -25) | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk OrgCalendar-test.apk
      - name: Publish the build log if the build failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log-${{ github.run_number }}
          name: Build log ${{ github.run_number }} (failed)
          prerelease: true
          make_latest: false
          files: |
            android/build.log
            prebuild.log
          fail_on_unmatched_files: false
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          make_latest: true
          files: OrgCalendar-test.apk
          body: |
            Test build of Org Calendar for Android, connected to the TEST database.
            Download OrgCalendar-test.apk on your phone, open it and allow installing from this source.
